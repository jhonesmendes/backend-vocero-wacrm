name: wacrm

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-pt-BR}
        SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://kong:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-pt-BR}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://kong:8000}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_APP_SECRET: ${META_APP_SECRET}
      META_APP_ID: ${META_APP_ID:-}
      AUTOMATION_CRON_SECRET: ${AUTOMATION_CRON_SECRET:-}
    networks: [wacrm]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 10s
      retries: 5

  proxy:
    image: caddy:2.10-alpine
    # Use somente quando não houver um proxy compartilhado no host.
    # Em Portainer + Nginx Proxy Manager, este serviço fica desativado.
    profiles: ["standalone-proxy"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      WACRM_DOMAIN: ${WACRM_DOMAIN}
    ports:
      # XAMPP e outras ferramentas locais podem ocupar 80/443 no Windows.
      - "${WACRM_HTTP_PORT:-8080}:80"
      - "${WACRM_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [wacrm]

  migrate:
    image: postgres:17-alpine
    profiles: ["tools"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    networks: [wacrm]
    entrypoint: ["/bin/sh", "/migrate.sh"]

networks:
  wacrm:
    name: wacrm-network
    external: true

volumes:
  caddy_data:
  caddy_config:
